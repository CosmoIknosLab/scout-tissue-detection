[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scout-tissue"
version = "1.0.2"
description = "SCOUT-open: risk-guided foundation-model escalation for tissue detection in whole-slide images"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-WEIGHTS.md"]
authors = [
    {name = "Cristian Tommasino", email = "cristian.tommasino@unina.it"},
    {name = "Antonio M. Rinaldi"},
]
keywords = ["computational pathology", "whole-slide image", "tissue detection", "foundation model"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "opencv-python-headless>=4.7",
    "Pillow>=9.0",
    "tifffile>=2023.1",
    "openslide-python>=1.4",
    "openslide-bin>=4.0",
    "torch>=2.1",
    "timm>=1.0",
    "segmentation-models-pytorch>=0.5",
    "huggingface_hub>=0.20",
]

[project.optional-dependencies]
demo = ["gradio>=4.0"]
test = ["pytest>=7"]

[project.scripts]
scout-tissue = "scout_tissue.cli:main"

[project.urls]
Homepage = "https://github.com/CosmoIknosLab/scout-tissue-detection"
Weights = "https://huggingface.co/Cristiandieti/scout-tissue-detection"
Paper = "https://arxiv.org/abs/2611.24366"
"Project page" = "https://cosmoiknoslab.github.io/scout-tissue-detection/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scout_tissue = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
